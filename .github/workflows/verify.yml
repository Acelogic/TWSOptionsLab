name: Verify Options Lab

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build the Rust server
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt
          cargo fmt --check
          cargo build --locked
      - name: Exercise the broker ledger and payoff graph with synthetic data
        run: |
          mkdir -p artifacts
          python3 scripts/verify-options-ledger.py --artifact artifacts/ledger.json
          node scripts/verify-scenario-date.mjs artifacts/scenario.json
      - name: Upload verification evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: options-lab-verification
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
